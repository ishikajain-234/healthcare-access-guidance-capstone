version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: healthcare-guidance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthcare_guidance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/01_migrations:ro
      - ./database/seeds:/docker-entrypoint-initdb.d/02_seeds:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_guidance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: healthcare-guidance-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres_secure_password@db:5432/healthcare_guidance_db
      ALLOW_UNAUTHENTICATED_ADMIN_DEMO: "false"
      ALLOW_UNAUTHENTICATED_STAFF_DEMO: "false"
      RATE_LIMIT_MAX_REQUESTS: "200"
      DB_POOL_MAX: "25"
      CORS_ORIGIN: "http://localhost,http://localhost:80,http://localhost:3000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: healthcare-guidance-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
